spring.application.name=todobarato

#configuración del servidor
server.port = 8080
server.servlet.context-path=/api/v1

#conexión a la base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:todobarato
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#configuración a JPA
spring.jpa.hibernate.ddl-auto=update

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#configuracion de las fechas created_at | updated_at
spring.jackson.time-zone=America/Lima
#desactivar advertencia open-in-view
spring.jpa.open-in-view=false

#Forzar a mostrar banner.txt - texto personalizado
spring.banner.location=classpath:banner.txt
#Configurar Swagger / OpenApi
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
